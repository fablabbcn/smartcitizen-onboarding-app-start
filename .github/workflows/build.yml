name: Build

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use https instead of ssh for github.com (sc-assets dependency)
        run: git config --global url."https://".insteadOf git://

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: npm install
      - run: npm run build
